name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # מאפשר הרצה ידנית מהממשק עם הפרמטרים
    inputs:
      browser:
        type: choice
        description: 'בחר דפדפן להרצה'
        required: true
        default: 'chrome'
        options:
          - chrome
          - firefox
          - webkit
      env:
        type: choice
        description: 'בחר סביבת הרצה'
        required: true
        default: 'qa1'
        options:
          - qa1
          - qa2
          - staging
          - prod

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Install
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Ensure browsers are installed
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run tests
        run: |
          # שליפת הערכים שנבחרו ב-UI (או ברירת המחדל בהרצת Push/PR אוטומטית)
          SELECTED_BROWSER="${{ github.event.inputs.browser || 'chrome' }}"
          SELECTED_ENV="${{ github.event.inputs.env || 'qa1' }}"
          
          xvfb-run mvn test -DsuiteXmlFile=smokeRunner.xml -Dbrowser=$SELECTED_BROWSER -Denv=$SELECTED_ENV -Dheadless=true